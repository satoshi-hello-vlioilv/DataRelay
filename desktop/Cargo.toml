[package]
name = "datarelay-desktop"
version = "1.95.0"
description = "DataRelay デスクトップ版（Tauri の窓＋Python の中身・ポートなし）"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "DataRelay"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# DPA（版 2.0.0）と同じ版に、通知領域のアイコン（tray-icon）・ダイアログ・通知を足す
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
