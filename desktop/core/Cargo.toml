[package]
name = "datarelay-core"
version = "0.1.0"
description = "DataRelay の中身（業務の処理）を Rust で受け持つ部品。窓（Tauri）に依らない"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
path = "src/lib.rs"

# 突き合わせの試験（tests/test_rust_parity.py）が、Python と同じ問い合わせをこの答え口へ送って比べる
[[bin]]
name = "datarelay-core"
path = "src/bin/datarelay-core.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# 更新履歴（lib/changelog.toml）を読む
toml = "0.8"
# いまの日時（PC の時刻帯）。日付の計算そのものは period.rs が自分で持つ
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 設定の手元の写し（app_settings.sqlite3）を読む。SQLite は exe に組み込む（PC に入れなくてよい）
rusqlite = { version = "0.37", features = ["bundled"] }
# symnavim.conf（CP932 のことがある）を読む
encoding_rs = "0.8"
# 記録の検索（画面で書く正規表現。Python の re と同じく先読み・後方参照も受ける。戻りすぎは上限で止まる）
fancy-regex = "0.14"

[target.'cfg(windows)'.dependencies]
# Navigator の接続情報の置き場（Windows の資格情報マネージャー・汎用資格情報）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Diagnostics_Debug"] }
