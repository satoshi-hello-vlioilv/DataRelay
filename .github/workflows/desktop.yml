# DataRelay.exe（desktop/・Tauri）を Windows で作り、本物の WebView2 で自己診断する。
# main に入ったら、通ったものを Release（v{版}）に置く:
#   DataRelay.zip … アプリのフォルダー一式＋exe（展開すればそのまま動く）／DataRelay.exe … exe だけの差し替え用
#   いつもの最新版: https://github.com/satoshi-hello-vlioilv/DataRelay/releases/latest/download/DataRelay.zip
name: desktop

on:
  push:
    branches: [main]          # main に入ったら毎回（配る zip には全部のファイルが入るので、場所で絞らない）
  pull_request:               # 作業の枝は pull_request で確かめるだけ（配らない）
    paths: ["desktop/**", "sidecar.py", "app.py", "lib/**", "static/**", "templates/**", "config/**", "tests/**", ".gitattributes", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # main は途中で止めない（配る途中で切れないように）

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python の部品（config/requirements.txt と同じ）
        run: python -m pip install -r config/requirements.txt

      - name: Python の試験（Windows・ポートなしの窓口と全ルートの突き合わせを含む）
        run: python -m unittest discover -s tests -t . -v

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Rust の試験
        working-directory: desktop
        run: cargo test --locked

      - name: exe を作る
        working-directory: desktop
        run: cargo build --release --locked

      - name: 自己診断（本物の WebView2・ポートなし。全体・閉じるだけ・起こし直し）
        # Python の場所は指定しない（ブラウザ版と同じ探し方で見つけられることも確かめる）
        run: python desktop/selftest_runner.py desktop/target/release/DataRelay.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DataRelay-desktop-windows
          path: desktop/target/release/DataRelay.exe
          if-no-files-found: warn

  # main に入ったものだけ配る。Windows の試験・自己診断が全部通ったときだけ進む（needs）。
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # Release とタグを作る
    concurrency:
      group: release           # 続けて main に入っても、配るのは1本ずつ
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DataRelay-desktop-windows
          path: dist

      - name: 配る形にする（zip・exe・本文）
        id: pkg
        shell: bash            # pipefail 付き（作るのに失敗したら tee で隠さず止まる）
        run: python3 .github/scripts/release.py package --exe dist/DataRelay.exe --out out | tee -a "$GITHUB_OUTPUT"

      - name: Release に置く（v{版}）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.pkg.outputs.version }}
          TITLE: ${{ steps.pkg.outputs.title }}
        run: |
          # 版を上げずに main が進んだときは、その版の Release を作り直す（タグも新しいコミットへ）。
          # 配っている zip とタグの指すコミットを、いつも同じにしておくため。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "同じ版 $TAG を作り直します"
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" out/DataRelay.zip out/DataRelay.exe \
            --title "$TITLE" --notes-file out/notes.md --target "$GITHUB_SHA" --latest
          echo "### $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
